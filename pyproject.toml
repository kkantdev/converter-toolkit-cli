 [build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "file-toolkit-cli"
version = "0.1.0"
description = "Fast, modular CLI tool for file conversion and KB size compression."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.8"
authors = [
    {name = "Krishnakant Singh"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: Utilities",
]
dependencies = [
    "rich>=10.0.0",
    "Pillow>=8.0.0",
    "packaging>=20.0"
]

[project.scripts]
cv = "converter.cli:main"
ft = "converter.cli:main"

[project.optional-dependencies]
pdf = [
    "pypdfium2>=4.0.0",
    "pdf2docx>=0.5.0"
]
office = [
    "python-pptx>=0.6.0",
    "python-docx>=0.8.0"
]
data = [
    "pandas>=1.3.0",
    "openpyxl>=3.0.0"
]
all = [
    "pypdfium2>=4.0.0",
    "pdf2docx>=0.5.0", 
    "python-pptx>=0.6.0",
    "python-docx>=0.8.0",
    "pandas>=1.3.0",
    "openpyxl>=3.0.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["converter*"]